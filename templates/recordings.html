{% extends "base.html" %}
{% block content %}
<h4 class="mb-3">Explorador de Grabaciones</h4>

<div class="row">
    <div class="col-md-4 col-lg-3">
        <div class="card">
            <div class="card-header">Archivos</div>
            <div class="card-body p-2">
                <div id="recording-tree"></div>
            </div>
        </div>
    </div>
    <div class="col-md-8 col-lg-9">
        <div class="card">
            <div class="card-header">Vista previa</div>
            <div class="card-body text-center" id="video-container">
                <p class="text-muted my-5">Selecciona un archivo de video en el árbol para previsualizarlo</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/tree.js"></script>
{% endblock %}
